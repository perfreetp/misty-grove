<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>开发板装配与引脚说明制作平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232aa895'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='700' text-anchor='middle' fill='%2305211c'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">§</span>
    <div class="brand-text">
      <b>BoardDocs Studio</b>
      <small>开发板装配与引脚说明制作平台</small>
    </div>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="当前位置"></nav>
  <div class="topbar-right">
    <span class="chip" id="gl-badge" title="渲染后端">WebGL</span>
    <details class="menu">
      <summary>数据</summary>
      <div class="menu-body">
        <button data-cmd="save">保存</button>
        <button data-cmd="export-json">导出 JSON</button>
        <label class="file-btn">导入 JSON<input type="file" id="import-json" accept="application/json,.json"></label>
        <button data-cmd="reset-demo">重置演示数据</button>
      </div>
    </details>
    <span class="user" id="current-user" title="当前用户">—</span>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="主导航">
    <button data-route="boards" class="active"><i>▦</i><span>型号</span></button>
    <button data-route="editor"><i>✎</i><span>编辑</span></button>
    <button data-route="reviews"><i>☑</i><span>评审</span></button>
    <button data-route="published"><i>⤓</i><span>发布</span></button>
    <button data-route="stats"><i>∑</i><span>统计</span></button>
  </nav>

  <main id="workspace" class="workspace"></main>

  <aside class="inspector" id="inspector" hidden></aside>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
